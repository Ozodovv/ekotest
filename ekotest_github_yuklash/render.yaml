services:
  - type: web
    name: ekotest
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: ADMIN_LOGIN
        value: admin
      - key: ADMIN_PASS
        sync: false
      - key: ADMIN_PATH
        value: /boshqaruv-x7k2
      - key: DATABASE_URL
        sync: false
