<!doctype html><html lang="uz"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#E8EFED"><meta name="robots" content="noindex"><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230B2A2D'/%3E%3Ccircle cx='16' cy='16' r='9' fill='none' stroke='%23E8EFED' stroke-width='1.5'/%3E%3Ccircle cx='16' cy='16' r='3.2' fill='%23D63A2B'/%3E%3C/svg%3E"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300..600;1,6..72,300..500&family=Hanken+Grotesk:wght@400;500;600&display=swap" rel="stylesheet"><title>Daraja testi — EkoTest</title><link rel="stylesheet" href="style.css"><script src="config.js"></script><script src="yol.js"></script><script src="api.js"></script></head><body><canvas id="topo" aria-hidden="true"></canvas><header class="top"><div class="wrap"><a class="brand" href="./"><svg viewBox="0 0 32 32" fill="none" stroke="#0B2A2D" stroke-width="1.3" aria-hidden="true"><path d="M16 3c7 1 12 6 12 13s-5 13-12 13S4 24 4 16 9 4 16 3z"/><path d="M16 8c4 1 7 4 7 8s-3 8-7 8-7-4-7-8 3-7 7-8z"/><circle cx="16" cy="16" r="2.6" fill="#D63A2B" stroke="none"/></svg>EkoTest</a><span class="note"></span></div></header>
<main class="stage"><div id="box"><p class="hint">Savollar yuklanmoqda…</p></div></main>
<script src="topo.js"></script>
<script>
const box=document.getElementById('box'),uid=localStorage.getItem('userId')||sessionStorage.getItem('userId');
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let NOM={},T,i=0,A={};
if(!uid){location.replace('./');}
else{
 setInterval(()=>API.ping(uid),20000);
 API.me(uid).then(({ok,d})=>{if(ok&&d.placement)location.replace('learn.html');}).catch(()=>{});
 API.test(uid).then(({ok,d})=>{
  if(!ok||!d||!Array.isArray(d.savollar)||!d.savollar.length){
   if(d&&d.xato){sessionStorage.removeItem('userId');localStorage.removeItem('userId');location.replace('./');return;}
   throw 0;}
  T=d;NOM=d.mavzular||{};show();
 }).catch(()=>{box.innerHTML='<p class="err">Savollarni yuklab bo\'lmadi. Internetni tekshirib, sahifani yangilang.</p><div class="nav"><span></span><button onclick="location.reload()">Yangilash</button></div>';});
}
function show(){
 const s=T.savollar[i],n=T.savollar.length,last=i===n-1;
 box.innerHTML=`<div class="meta"><span>${esc(s.mavzu)}</span><span><b>${i+1}</b> / ${n}</span></div>
 <div class="track"><i style="width:${i/n*100}%"></i></div>
 <div class="swap"><h2 class="qtext">${esc(s.q)}</h2>
 <div class="opts" role="radiogroup" aria-label="Javob variantlari">${s.variantlar.map((v,k)=>`<label class="opt"><input type="radio" name="o" value="${esc(v)}"${A[s.id]===v?' checked':''}><span class="k">${k+1}</span><span>${esc(v)}</span></label>`).join('')}</div>
 <div class="nav"><button class="ghost" id="back"${i?'':' disabled'}>Orqaga</button><span class="hint" id="h">${last?'Oxirgi savol':'1–4 tugmalari bilan tanlash mumkin'}</span><button id="next" disabled>${last?'Natijani ko\'rish':'Keyingi savol'}</button></div><div class="err" id="err" role="alert"></div></div>`;
 requestAnimationFrame(()=>{box.querySelector('.track i').style.width=(i+(A[s.id]?1:0.0001))/n*100+'%';});
 const nx=document.getElementById('next');nx.disabled=!A[s.id];
 box.querySelectorAll('input').forEach(r=>r.onchange=()=>{A[s.id]=r.value;nx.disabled=false;box.querySelector('.track i').style.width=(i+1)/n*100+'%';});
 document.getElementById('back').onclick=()=>{i--;show();};
 nx.onclick=()=>last?send():(i++,show());
}
document.addEventListener('keydown',e=>{
 if(!T||!box.querySelector('.opts')||e.ctrlKey||e.metaKey||e.altKey)return;
 const k=+e.key;if(k>=1&&k<=4){const r=box.querySelectorAll('input')[k-1];if(r){r.checked=true;r.dispatchEvent(new Event('change'));}}
 else if(e.key==='Enter'&&!document.getElementById('next').disabled&&document.activeElement.tagName!=='BUTTON'){document.getElementById('next').click();}
});
async function send(){
 const b=document.getElementById('next'),er=document.getElementById('err');er.textContent='';b.disabled=true;b.textContent='Tekshirilmoqda…';
 try{const {ok,d:n}=await API.submit(uid,T.attemptId,A);
  if(!ok){er.textContent=(n&&n.xato)||'Natijani yuborib bo\'lmadi. Qayta bosing.';b.disabled=false;b.textContent='Natijani ko\'rish';return;}
  result(n);window.scrollTo({top:0});}
 catch(x){er.textContent='Natijani yuborib bo\'lmadi. Internetni tekshirib, qayta bosing.';b.disabled=false;b.textContent='Natijani ko\'rish';}
}
function result(n){
 const msg=n.daraja==='Yuqori'?'Ekologiya bo\'yicha bilimingiz yaxshi. Darslarda xatolar qilgan mavzularingiz birinchi o\'rinda turadi.':n.daraja==="O'rta"?'Asosiy bilimlar bor. Past natija chiqqan mavzular sizning yo\'lingizda birinchi o\'rinda turadi.':'Hozircha boshlang\'ich daraja. Mavzularni darslar orqali birma-bir o\'rganamiz.';
 box.innerHTML=`<div class="swap"><div class="meta"><span>Daraja testi natijasi</span><span>${n.jami} ta savoldan ${n.togri} tasi to'g'ri</span></div><div class="track"><i style="width:100%"></i></div>
 <div class="result"><div class="big">${n.foiz}<sup>%</sup></div><div><div class="level lv-${n.daraja==='Yuqori'?'hi':n.daraja==='O\'rta'?'mid':'lo'}">${esc(n.daraja)} daraja</div><p>${msg}</p></div></div>
 <div class="bars">${Object.entries(n.mavzuStat).map(([k,v])=>`<div class="bar"><span>${esc(NOM[k]||k)}</span><div><i data-w="${v.togri/v.jami*100}"></i></div><b>${v.togri}/${v.jami}</b></div>`).join('')}</div>
 <div class="nav"><span class="hint">Mavzular daraja testi natijasiga ko'ra tartiblandi.</span><a class="btn" style="text-decoration:none" href="learn.html">O'qishni boshlash <span aria-hidden="true">→</span></a></div></div>`;
 requestAnimationFrame(()=>requestAnimationFrame(()=>box.querySelectorAll('.bar i').forEach(e=>e.style.width=e.dataset.w+'%')));
}
</script></body></html>
