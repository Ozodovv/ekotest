<!doctype html><html lang="uz"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#E8EFED"><meta name="robots" content="noindex"><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230B2A2D'/%3E%3Ccircle cx='16' cy='16' r='9' fill='none' stroke='%23E8EFED' stroke-width='1.5'/%3E%3Ccircle cx='16' cy='16' r='3.2' fill='%23D63A2B'/%3E%3C/svg%3E"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300..600;1,6..72,300..500&family=Hanken+Grotesk:wght@400;500;600&display=swap" rel="stylesheet"><title>Dars — EkoTest</title><link rel="stylesheet" href="style.css"><script src="config.js"></script><script src="yol.js"></script><script src="api.js"></script></head><body>
<canvas id="topo" aria-hidden="true"></canvas><header class="top"><div class="wrap"><a class="brand" href="./"><svg viewBox="0 0 32 32" fill="none" stroke="#0B2A2D" stroke-width="1.3" aria-hidden="true"><path d="M16 3c7 1 12 6 12 13s-5 13-12 13S4 24 4 16 9 4 16 3z"/><path d="M16 8c4 1 7 4 7 8s-3 8-7 8-7-4-7-8 3-7 7-8z"/><circle cx="16" cy="16" r="2.6" fill="#D63A2B" stroke="none"/></svg>EkoTest</a><span class="note"><a href="learn.html" style="color:inherit">Mening yo'lim</a></span></div></header>
<main class="page" id="box"><p class="hint">Yuklanmoqda…</p></main>
<script src="topo.js"></script>
<script>
const box=document.getElementById('box');
const uid=localStorage.getItem('userId')||sessionStorage.getItem('userId');
const tid=new URLSearchParams(location.search).get('t');
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const stepsBar=n=>`<div class="steps"><span class="${n===1?'on':''}">1. Dars</span><span class="${n===2?'on':''}">2. Test</span><span class="${n===3?'on':''}">3. Natija</span></div>`;
const crumb='<a class="crumb" href="learn.html">← Mening yo\'lim</a>';
let L=null,Q=null,qi=0,done=0;

function fail(msg){box.innerHTML=crumb+`<p class="err">${esc(msg)}</p><div class="nav"><span></span><a class="btn" style="text-decoration:none" href="learn.html">Mening yo'lim</a></div>`;}
if(!uid||!tid){location.replace(uid?'learn.html':'./');}
else{
 setInterval(()=>API.ping(uid),20000);
 API.dars(uid,tid).then(({ok,d})=>{
  if(!ok){
   if(d&&d.daraja){location.replace('test.html');return;}
   if(d&&d.xato==='Foydalanuvchi topilmadi.'){localStorage.removeItem('userId');sessionStorage.removeItem('userId');location.replace('./');return;}
   fail((d&&d.xato)||'Darsni ochib bo\'lmadi.');return;}
  L=d;lesson();
 }).catch(()=>fail('Yuklab bo\'lmadi. Internetni tekshirib, sahifani yangilang.'));
}

function lesson(){
 const D=L.dars;
 document.title=D.sarlavha+' — EkoTest';
 box.innerHTML=`<div class="swap lesson">${crumb}${stepsBar(1)}
 <p class="kicker">${esc(L.nom)}</p><h1>${esc(D.sarlavha)}</h1><p class="intro">${esc(D.kirish)}</p>
 <div class="prose">${D.bolimlar.map(b=>`<h3>${esc(b.h)}</h3>${b.p.map(p=>`<p>${esc(p)}</p>`).join('')}`).join('')}</div>
 <div class="keys"><h4>Esda tuting</h4><ul>${D.eslab.map(e=>`<li>${esc(e)}</li>`).join('')}</ul></div>
 <div class="nav"><span class="hint">Mavzu testi: bir necha savol, o'tish bali 70%</span><button id="start">Mavzu testiga o'tish <span aria-hidden="true">→</span></button></div>
 <div class="err" id="err" role="alert"></div></div>`;
 window.scrollTo({top:0});
 document.getElementById('start').onclick=startQuiz;
}

async function startQuiz(){
 const b=document.getElementById('start');if(b){b.disabled=true;b.textContent='Yuklanmoqda…';}
 try{
  const {ok,d}=await API.quizStart(uid,tid);
  if(!ok||!d.savollar||!d.savollar.length){const e=document.getElementById('err');if(e)e.textContent=(d&&d.xato)||'Testni boshlab bo\'lmadi.';if(b){b.disabled=false;b.innerHTML='Mavzu testiga o\'tish <span aria-hidden="true">→</span>';}return;}
  Q=d;qi=0;done=0;question();window.scrollTo({top:0});
 }catch(x){const e=document.getElementById('err');if(e)e.textContent='Serverga ulanib bo\'lmadi. Qayta urinib ko\'ring.';if(b){b.disabled=false;b.innerHTML='Mavzu testiga o\'tish <span aria-hidden="true">→</span>';}}
}

function question(){
 const s=Q.savollar[qi],n=Q.savollar.length,last=qi===n-1;
 box.innerHTML=`<div class="swap">${crumb}${stepsBar(2)}
 <div class="meta"><span>${esc(Q.nom)}</span><span><b>${qi+1}</b> / ${n}</span></div>
 <div class="track"><i style="width:${qi/n*100}%"></i></div>
 <h2 class="qtext">${esc(s.q)}</h2>
 <div class="opts" role="radiogroup" aria-label="Javob variantlari">${s.variantlar.map((v,k)=>`<label class="opt"><input type="radio" name="o" value="${esc(v)}"><span class="k">${k+1}</span><span>${esc(v)}</span></label>`).join('')}</div>
 <div class="fb" id="fb" role="status" aria-live="polite"></div>
 <div class="nav"><span class="hint" id="h">1–4 tugmalari bilan tanlash mumkin</span><button id="next" disabled>${last?'Natijani ko\'rish':'Keyingi savol'}</button></div>
 <div class="err" id="err" role="alert"></div></div>`;
 requestAnimationFrame(()=>{box.querySelector('.track i').style.width=(qi+0.0001)/n*100+'%';});
 const nx=document.getElementById('next');
 box.querySelectorAll('input').forEach(r=>r.onchange=()=>answer(s,r.value));
 nx.onclick=()=>last?finish():(qi++,question());
}

let busy=false;
async function answer(s,val){
 if(busy||done>qi)return;busy=true;
 const opts=box.querySelector('.opts'),er=document.getElementById('err');er.textContent='';
 try{
  const {ok,d}=await API.quizCheck(Q.attemptId,s.id,val);
  if(!ok){er.textContent=(d&&d.xato)||'Javobni tekshirib bo\'lmadi. Qayta tanlang.';box.querySelectorAll('input').forEach(i=>i.checked=false);busy=false;return;}
  done=qi+1;opts.classList.add('locked');
  box.querySelectorAll('.opt').forEach(l=>{
   const i=l.querySelector('input');i.disabled=true;
   if(i.value===d.togriMatn)l.classList.add('ok');
   else if(i.value===d.tanlangan)l.classList.add('bad');
  });
  const fb=document.getElementById('fb');
  fb.className='fb '+(d.togri?'ok':'bad');
  fb.textContent=d.togri?'To\'g\'ri!':'Noto\'g\'ri. To\'g\'ri javob: '+d.togriMatn;
  box.querySelector('.track i').style.width=(qi+1)/Q.savollar.length*100+'%';
  const nx=document.getElementById('next');nx.disabled=false;nx.focus({preventScroll:true});
  document.getElementById('h').textContent='';
 }catch(x){er.textContent='Internetni tekshirib, qayta tanlang.';box.querySelectorAll('input').forEach(i=>i.checked=false);}
 busy=false;
}

document.addEventListener('keydown',e=>{
 if(!Q||e.ctrlKey||e.metaKey||e.altKey)return;
 const opts=box.querySelector('.opts');if(!opts)return;
 const k=+e.key;
 if(k>=1&&k<=4&&!opts.classList.contains('locked')){const r=box.querySelectorAll('input')[k-1];if(r){r.checked=true;r.dispatchEvent(new Event('change'));}}
 else if(e.key==='Enter'){const nx=document.getElementById('next');if(nx&&!nx.disabled&&document.activeElement.tagName!=='BUTTON')nx.click();}
});

async function finish(){
 const b=document.getElementById('next'),er=document.getElementById('err');er.textContent='';b.disabled=true;b.textContent='Hisoblanmoqda…';
 try{
  const {ok,d}=await API.quizFinish(Q.attemptId);
  if(!ok){er.textContent=(d&&d.xato)||'Natijani yuborib bo\'lmadi. Qayta bosing.';b.disabled=false;b.textContent='Natijani ko\'rish';return;}
  result(d);window.scrollTo({top:0});
 }catch(x){er.textContent='Natijani yuborib bo\'lmadi. Internetni tekshirib, qayta bosing.';b.disabled=false;b.textContent='Natijani ko\'rish';}
}

function result(r){
 Q=null;
 const lv=r.foiz>=85?'hi':r.foiz>=60?'mid':'lo';
 const next=r.otdi&&r.keyingi?`<a class="btn" style="text-decoration:none" href="dars.html?t=${encodeURIComponent(r.keyingi)}">Keyingi mavzu <span aria-hidden="true">→</span></a>`:'';
 const retry=r.otdi?'':`<button id="again">Testni qayta ishlash</button><button class="ghost" id="reread">Darsni qayta o'qish</button>`;
 const msg=r.otdi
  ?(r.tugagan===r.jami_mavzu?'Barcha mavzularni muvaffaqiyatli tugatdingiz. Tabriklaymiz!':'Mavzu o\'zlashtirildi, keyingi mavzu ochildi.')
  :`Bu mavzudan o'tish uchun kamida ${r.pass}% kerak. Darsni qayta o'qib, testni yana ishlang. Savollar har safar o'zgaradi.`;
 box.innerHTML=`<div class="swap">${crumb}${stepsBar(3)}
 <div class="meta"><span>${esc(L.nom)}</span><span>${r.jami} ta savoldan ${r.togri} tasi to'g'ri</span></div><div class="track"><i style="width:100%"></i></div>
 <div class="result"><div class="big">${r.foiz}<sup>%</sup></div><div><span class="badge ${r.otdi?'ok':'no'}">${r.otdi?'Mavzudan o\'tdingiz':'Hali o\'tmadingiz'}</span><p>${esc(msg)}</p></div></div>
 <p class="hint" style="margin-top:28px">Tugatilgan mavzular: ${r.tugagan}/${r.jami_mavzu}${r.daraja?' · joriy daraja: '+esc(r.daraja):''}</p>
 <div class="actions">${next}${retry}<a class="btn ghost" style="text-decoration:none;color:inherit;background:transparent;border-color:var(--line)" href="learn.html">Mening yo'lim</a></div></div>`;
 const a=document.getElementById('again');if(a)a.onclick=()=>{a.disabled=true;a.textContent='Yuklanmoqda…';startQuiz();};
 const rr=document.getElementById('reread');if(rr)rr.onclick=()=>{lesson();};
}
</script></body></html>
