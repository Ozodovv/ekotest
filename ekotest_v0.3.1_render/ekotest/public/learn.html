<!doctype html><html lang="uz"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#E8EFED"><meta name="robots" content="noindex"><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230B2A2D'/%3E%3Ccircle cx='16' cy='16' r='9' fill='none' stroke='%23E8EFED' stroke-width='1.5'/%3E%3Ccircle cx='16' cy='16' r='3.2' fill='%23D63A2B'/%3E%3C/svg%3E"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300..600;1,6..72,300..500&family=Hanken+Grotesk:wght@400;500;600&display=swap" rel="stylesheet"><title>Mening yo'lim — EkoTest</title><link rel="stylesheet" href="style.css"><script src="config.js"></script><script src="yol.js"></script><script src="api.js"></script></head><body>
<canvas id="topo" aria-hidden="true"></canvas><header class="top"><div class="wrap"><a class="brand" href="./"><svg viewBox="0 0 32 32" fill="none" stroke="#0B2A2D" stroke-width="1.3" aria-hidden="true"><path d="M16 3c7 1 12 6 12 13s-5 13-12 13S4 24 4 16 9 4 16 3z"/><path d="M16 8c4 1 7 4 7 8s-3 8-7 8-7-4-7-8 3-7 7-8z"/><circle cx="16" cy="16" r="2.6" fill="#D63A2B" stroke="none"/></svg>EkoTest</a><span class="note">Mening yo'lim</span></div></header>
<main class="page" id="box"><p class="hint">Yuklanmoqda…</p></main>
<script src="topo.js"></script>
<script>
const box=document.getElementById('box');
const uid=localStorage.getItem('userId')||sessionStorage.getItem('userId');
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const out=()=>{localStorage.removeItem('userId');sessionStorage.removeItem('userId');location.replace('./');};
if(!uid)out();
else{
 setInterval(()=>API.ping(uid),20000);
 API.me(uid).then(({ok,d})=>{
  if(!ok){if(d&&d.xato){out();return;}throw 0;}
  if(!d.placement){location.replace('test.html');return;}
  render(d);
 }).catch(()=>{box.innerHTML='<p class="err">Yuklab bo\'lmadi. Internetni tekshirib, sahifani yangilang.</p><div class="nav"><span></span><button onclick="location.reload()">Yangilash</button></div>';});
}
function render(d){
 const cur=d.yol.find(x=>x.holat==='ochiq');
 const all=d.tugagan===d.jami;
 const lead=all
  ?'Barcha mavzularni tugatdingiz. Tabriklaymiz! Istalgan mavzuni qayta ko\'rib, natijangizni yaxshilashingiz mumkin.'
  :'Daraja testi natijasiga ko\'ra mavzular sizga mos tartibda joylashtirildi. Har bir mavzuda avval dars, keyin qisqa test bor. Testdan '+d.pass+'% va undan yuqori ball olsangiz, keyingi mavzu ochiladi.';
 box.innerHTML=`<div class="swap"><p class="eyebrow">Mening yo'lim</p>
 <h1 class="t">Salom, ${esc(d.ism)}</h1>
 <p class="lead">${lead}</p>
 <div class="summary">
  <div><b>${esc(d.daraja||'—')}</b><span>joriy daraja</span></div>
  <div><b>${d.placement.foiz}%</b><span>daraja testi natijasi</span></div>
  <div><b>${d.tugagan}/${d.jami}</b><span>tugatilgan mavzu</span></div>
 </div>
 <div class="pbar" aria-hidden="true"><i data-w="${d.tugagan/d.jami*100}"></i></div>
 <div class="path">${d.yol.map((s,i)=>step(s,i,cur)).join('')}</div>
 <p class="legend"><span class="chip rec">Tavsiya</span> daraja testida shu mavzuda xato qilgansiz, avval shuni o'rganing.</p></div>`;
 requestAnimationFrame(()=>requestAnimationFrame(()=>box.querySelectorAll('.pbar i').forEach(e=>e.style.width=e.dataset.w+'%')));
}
function step(s,i,cur){
 const n=String(i+1).padStart(2,'0');
 const chips=[
  s.belgi==='tavsiya'&&s.holat!=='tugagan'?'<span class="chip rec">Tavsiya</span>':'',
  s.belgi==='tanish'&&s.holat!=='tugagan'?'<span class="chip know">Daraja testida to\'g\'ri javob bergansiz</span>':'',
  s.holat==='tugagan'?'<span class="chip done">Tugagan</span><span>eng yaxshi natija: '+s.eng+'%</span>':(s.urinish?'<span>eng yaxshi: '+s.eng+'%, urinish: '+s.urinish+'</span>':'')
 ].join('');
 if(s.holat==='yopiq')return `<div class="step yopiq"><span class="n">${n}</span><div><h3>${esc(s.nom)}</h3><div class="m"><span>Oldingi mavzu testidan o'tgach ochiladi</span></div></div><span class="go">Yopiq</span></div>`;
 const isCur=cur&&cur.id===s.id;
 const label=s.holat==='tugagan'?'Qayta ko\'rish':isCur?(s.urinish?'Davom etish':'Boshlash'):'Ochish';
 return `<a class="step ochiq" href="dars.html?t=${encodeURIComponent(s.id)}"><span class="n">${n}</span><div><h3>${esc(s.nom)}</h3><div class="m">${chips}</div></div><span class="go${isCur?' btnlike':''}">${label} <span aria-hidden="true">→</span></span></a>`;
}
</script></body></html>
