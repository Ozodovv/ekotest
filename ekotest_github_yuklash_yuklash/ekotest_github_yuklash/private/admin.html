<!doctype html><html lang="uz"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#E8EFED"><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230B2A2D'/%3E%3Ccircle cx='16' cy='16' r='9' fill='none' stroke='%23E8EFED' stroke-width='1.5'/%3E%3Ccircle cx='16' cy='16' r='3.2' fill='%23D63A2B'/%3E%3C/svg%3E"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300..600;1,6..72,300..500&family=Hanken+Grotesk:wght@400;500;600&display=swap" rel="stylesheet"><title>Boshqaruv paneli — EkoTest</title><link rel="stylesheet" href="style.css"><script src="config.js"></script><script src="api.js"></script></head><body><canvas id="topo" aria-hidden="true"></canvas><header class="top"><div class="wrap"><a class="brand" href="./"><svg viewBox="0 0 32 32" fill="none" stroke="#0B2A2D" stroke-width="1.3" aria-hidden="true"><path d="M16 3c7 1 12 6 12 13s-5 13-12 13S4 24 4 16 9 4 16 3z"/><path d="M16 8c4 1 7 4 7 8s-3 8-7 8-7-4-7-8 3-7 7-8z"/><circle cx="16" cy="16" r="2.6" fill="#D63A2B" stroke="none"/></svg>EkoTest</a><span class="note">Boshqaruv</span></div></header>
<main class="admin wrap">
 <section id="login" class="panel login">
  <h2>Kirish</h2><p class="sub">Boshqaruv paneliga faqat administrator kiradi.</p>
  <label for="l">Login</label><input id="l" autocomplete="username">
  <label for="p">Parol</label><input id="p" type="password" autocomplete="current-password">
  <button class="full" id="go">Kirish</button><div class="err" id="err" role="alert"></div>
 </section>
 <section id="panel" hidden>
  <div class="stats">
   <div class="stat"><b id="a">0</b>Hozir onlayn</div>
   <div class="stat"><b id="b">0</b>Ro'yxatdan o'tganlar</div>
   <div class="stat"><b id="c">0</b>Ishlangan testlar</div>
  </div>
  <div class="tools"><div><label for="q" style="margin-top:0">Qidirish</label><input id="q" placeholder="Ism, viloyat yoki maktab"></div><button class="ghost" id="csv">CSV yuklab olish</button></div>
  <div class="scroll"><table><thead><tr><th>Ism familya</th><th>Hudud</th><th>Maktab</th><th>Daraja</th><th>Daraja testi</th><th>Mavzular</th><th>Testlar</th></tr></thead><tbody id="rows"></tbody></table></div>
 </section>
</main>
<script src="topo.js"></script>
<script>
const $=id=>document.getElementById(id);let tok=sessionStorage.getItem('adm'),D=[];
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function rows(){const q=$('q').value.trim().toLowerCase();
 const list=D.filter(u=>!q||[u.ism,u.familya,u.viloyat,u.tuman,u.maktab].join(' ').toLowerCase().includes(q));
 $('rows').innerHTML=list.length?list.map(u=>`<tr><td>${esc(u.familya)} ${esc(u.ism)}</td><td>${esc(u.viloyat)}, ${esc(u.tuman)}</td><td>${esc(u.maktab)}</td><td><span class="lv ${u.daraja==='Yuqori'?'hi':u.daraja==="O'rta"?'mid':''}">${esc(u.daraja)}</span></td><td>${u.foiz===null?'—':u.foiz+'%'}</td><td>${u.tugagan}/${u.jamiMavzu}</td><td>${u.testlar}</td></tr>`).join(''):'<tr><td colspan="7">Hech narsa topilmadi.</td></tr>';}
async function load(){
 let r;try{r=await fetch(API.base+'/api/admin/stats',{headers:{'x-admin-token':tok||''}});}catch(e){return;}
 if(!r.ok){sessionStorage.removeItem('adm');tok=null;$('login').hidden=false;$('panel').hidden=true;return;}
 const d=await r.json();$('login').hidden=true;$('panel').hidden=false;D=d.foydalanuvchilar;
 $('a').textContent=d.online;$('b').textContent=d.jamiFoydalanuvchi;$('c').textContent=d.jamiTest;rows();
}
$('q').oninput=rows;
$('csv').onclick=()=>{const h=['Ism','Familya','Viloyat','Tuman','Maktab','Daraja','Daraja testi foizi','Tugatilgan mavzular','Testlar'];
 const c=v=>{let t=String(v??'');if(/^[=+\-@\t\r]/.test(t))t="'"+t;return '"'+t.replace(/"/g,'""')+'"';};
 const t=[h.map(c).join(',')].concat(D.map(u=>[u.ism,u.familya,u.viloyat,u.tuman,u.maktab,u.daraja,u.foiz,u.tugagan+'/'+u.jamiMavzu,u.testlar].map(c).join(','))).join('\n');
 const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+t],{type:'text/csv'}));a.download='ekotest.csv';a.click();};
$('go').onclick=async()=>{$('err').textContent='';
 try{const r=await fetch(API.base+'/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({login:$('l').value,parol:$('p').value})});
 const d=await r.json();if(!r.ok){$('err').textContent=d.xato||'Kirib bo\'lmadi.';return;}tok=d.token;sessionStorage.setItem('adm',tok);load();}
 catch(e){$('err').textContent='Serverga ulanib bo\'lmadi.';}};
$('p').onkeydown=$('l').onkeydown=e=>{if(e.key==='Enter')$('go').click();};
if(API.local){$('login').innerHTML='<h2>Boshqaruv paneli</h2><p class="sub">Bu serversiz (GitHub Pages) versiya, shuning uchun admin paneli ishlamaydi. Uni yoqish uchun saytni Render serveriga joylashtiring.</p>';}
else{if(tok)load();setInterval(()=>{if(tok&&!$('panel').hidden)load();},10000);}
</script></body></html>
